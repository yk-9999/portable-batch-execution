[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "portable-batch-execution"
version = "0.1.0"
description = "A backend-agnostic framework for finite, reproducible batch workloads."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2,<3", "httpx>=0.27"]

[project.optional-dependencies]
tabular = ["duckdb>=1.1", "polars>=1.0"]
ml = ["scikit-learn>=1.5"]
distilbert = [
  "torch==2.11.0",
  "transformers==5.17.0",
  "safetensors==0.8.0",
]
all = ["portable-batch-execution[tabular,ml,distilbert]"]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
  "duckdb>=1.1",
  "polars>=1.0",
  "scikit-learn>=1.5",
]

[project.scripts]
pbe-a1-controller = "portable_batch_execution.controller.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
target-version = "py311"

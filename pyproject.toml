[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "portable-batch-execution"
version = "0.1.0"
description = "A backend-agnostic framework for finite, reproducible batch workloads."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2,<3", "httpx>=0.27"]

[project.optional-dependencies]
tabular = ["duckdb>=1.1", "polars>=1.0"]
acquisition = ["dlt>=1.0", "scrapy>=2.11"]
ml = ["scikit-learn>=1.5"]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
  "duckdb>=1.1",
  "polars>=1.0",
  "scikit-learn>=1.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

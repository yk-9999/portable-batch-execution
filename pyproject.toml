[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "portable-batch-execution"
version = "0.1.0"
description = "A backend-agnostic framework for finite, reproducible batch workloads."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

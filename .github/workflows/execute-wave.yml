name: Execute wave

on:
  workflow_dispatch:
    inputs:
      wave_id:
        description: Planned wave identifier
        required: true
        type: string

permissions:
  contents: read

jobs:
  execute-wave:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@22695119d769bdb6f7032ad67b9bca0ef8c4a174
      - run: uv sync --dev
      - run: uv run python -m portable_batch_execution.worker.execute_wave --wave-id "$PBE_WAVE_ID"
        env:
          PBE_WAVE_ID: ${{ inputs.wave_id }}

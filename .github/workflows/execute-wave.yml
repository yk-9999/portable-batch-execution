name: Execute wave

on:
  workflow_dispatch:
    inputs:
      wave_id:
        description: Planned wave identifier
        required: true
        type: string
      run_id:
        description: Opaque private run identifier (private / HF-direct modes)
        required: false
        type: string
      private:
        description: Resolve the closed wave from the Private Data Plane
        required: false
        default: false
        type: boolean
      jpx_hf_direct:
        description: Execute JPX pair-trading HF Bucket-direct lane (metadata-only)
        required: false
        default: false
        type: boolean
      hf_wave_descriptor_ref:
        description: HF Bucket ref JSON for the wave descriptor (HF-direct only)
        required: false
        type: string
      hf_wave_result_manifest_object_path:
        description: Deterministic HF result-manifest object path (HF-direct only)
        required: false
        type: string

permissions:
  contents: read

jobs:
  execute-wave:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Resolve dependency profile
        id: dependency_profile
        env:
          PBE_WAVE_ID: ${{ inputs.wave_id }}
          PBE_RUN_ID: ${{ inputs.run_id }}
          PBE_MODE: ${{ inputs.jpx_hf_direct && 'hf-direct' || (inputs.private && 'private' || 'public') }}
          PBE_PRIVATE_DATA_PLANE_BASE_URL: ${{ inputs.private && !inputs.jpx_hf_direct && secrets.PBE_PRIVATE_DATA_PLANE_BASE_URL || '' }}
          PBE_PRIVATE_DATA_PLANE_BEARER_TOKEN: ${{ inputs.private && !inputs.jpx_hf_direct && secrets.PBE_PRIVATE_DATA_PLANE_BEARER_TOKEN || '' }}
        run: python3 .github/scripts/resolve_execute_wave_dependency_profile.py
      - uses: astral-sh/setup-uv@22695119d769bdb6f7032ad67b9bca0ef8c4a174
      - name: Install dependencies (replay-batch)
        if: steps.dependency_profile.outputs.profile == 'replay-batch'
        run: uv sync --extra replay
      - name: Install dependencies (default)
        if: steps.dependency_profile.outputs.profile != 'replay-batch'
        run: uv sync --dev --extra distilbert
      - name: Install FFmpeg
        if: steps.dependency_profile.outputs.profile != 'replay-batch'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - run: uv run python -m portable_batch_execution.worker.execute_wave --wave-id "$PBE_WAVE_ID" --run-id "$PBE_RUN_ID" --mode "$PBE_MODE"
        env:
          PBE_WAVE_ID: ${{ inputs.wave_id }}
          PBE_RUN_ID: ${{ inputs.run_id }}
          PBE_MODE: ${{ inputs.jpx_hf_direct && 'hf-direct' || (inputs.private && 'private' || 'public') }}
          PBE_PRIVATE_DATA_PLANE_BASE_URL: ${{ inputs.private && !inputs.jpx_hf_direct && secrets.PBE_PRIVATE_DATA_PLANE_BASE_URL || '' }}
          PBE_PRIVATE_DATA_PLANE_BEARER_TOKEN: ${{ inputs.private && !inputs.jpx_hf_direct && secrets.PBE_PRIVATE_DATA_PLANE_BEARER_TOKEN || '' }}
          PBE_JPX_HF_DIRECT: ${{ inputs.jpx_hf_direct && '1' || '' }}
          HF_TOKEN: ${{ inputs.jpx_hf_direct && secrets.HF_SYSTEM_TRADING_DATA_RW_TOKEN || '' }}
          PBE_HF_WAVE_DESCRIPTOR_REF: ${{ inputs.jpx_hf_direct && inputs.hf_wave_descriptor_ref || '' }}
          PBE_HF_WAVE_RESULT_MANIFEST_OBJECT_PATH: ${{ inputs.jpx_hf_direct && inputs.hf_wave_result_manifest_object_path || '' }}

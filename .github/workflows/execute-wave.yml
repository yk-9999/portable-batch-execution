name: Execute wave

on:
  workflow_dispatch:
    inputs:
      wave_id:
        description: Planned wave identifier
        required: true
        type: string

permissions:
  contents: read

jobs:
  execute-wave:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@22695119d769bdb6f7032ad67b9bca0ef8c4a174
      - run: uv sync --dev
      - run: uv run python -m portable_batch_execution.worker.execute_wave --wave-id "$PBE_WAVE_ID"
        env:
          PBE_WAVE_ID: ${{ inputs.wave_id }}

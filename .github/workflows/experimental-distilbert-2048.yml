name: Experimental DistilBERT 2048 public benchmark

on:
  push:
    branches:
      - experiment/distilbert-single-request-2048-20261030

permissions:
  contents: read

jobs:
  group1_2048_sequential:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: group1 1x2048 sequential
    outputs:
      job_started_at: ${{ steps.record_timestamps.outputs.job_started_at }}
      job_finished_at: ${{ steps.record_timestamps.outputs.job_finished_at }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@22695119d769bdb6f7032ad67b9bca0ef8c4a174
      - run: uv sync --dev --extra distilbert
      - name: Run synthetic public benchmark case
        env:
          PBE_BENCH_CASE_ID: 1x2048_sequential
          PBE_BENCH_MODE: sequential
          PBE_BENCH_OFFSET: "0"
          PBE_BENCH_ROW_COUNT: "2048"
        run: |
          set -euo pipefail
          uv run python tests/performance/distilbert_fullsize_public_benchmark.py | tee benchmark-case.json
      - name: Record group timestamps from benchmark JSON
        id: record_timestamps
        run: |
          START=$(python -c "import json; print(json.load(open('benchmark-case.json'))['timestamps']['job_started_at'])")
          END=$(python -c "import json; print(json.load(open('benchmark-case.json'))['timestamps']['job_finished_at'])")
          echo "job_started_at=$START" >> "$GITHUB_OUTPUT"
          echo "job_finished_at=$END" >> "$GITHUB_OUTPUT"
          {
            echo "### Group 1 (1x2048 sequential)"
            echo "- job_started_at: $START"
            echo "- job_finished_at: $END"
          } >> "$GITHUB_STEP_SUMMARY"

  group2_1024_sequential:
    needs: group1_2048_sequential
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: group2 2x1024 sequential offset-${{ matrix.offset }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - offset: 0
            row_count: 1024
          - offset: 1024
            row_count: 1024
    outputs:
      job_started_at: ${{ steps.record_timestamps.outputs.job_started_at }}
      job_finished_at: ${{ steps.record_timestamps.outputs.job_finished_at }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@22695119d769bdb6f7032ad67b9bca0ef8c4a174
      - run: uv sync --dev --extra distilbert
      - name: Run synthetic public benchmark case
        env:
          PBE_BENCH_CASE_ID: 2x1024_sequential
          PBE_BENCH_MODE: sequential
          PBE_BENCH_OFFSET: ${{ matrix.offset }}
          PBE_BENCH_ROW_COUNT: ${{ matrix.row_count }}
        run: |
          set -euo pipefail
          uv run python tests/performance/distilbert_fullsize_public_benchmark.py | tee benchmark-case.json
      - name: Record group timestamps from benchmark JSON
        id: record_timestamps
        run: |
          START=$(python -c "import json; print(json.load(open('benchmark-case.json'))['timestamps']['job_started_at'])")
          END=$(python -c "import json; print(json.load(open('benchmark-case.json'))['timestamps']['job_finished_at'])")
          echo "job_started_at=$START" >> "$GITHUB_OUTPUT"
          echo "job_finished_at=$END" >> "$GITHUB_OUTPUT"
          {
            echo "### Group 2 shard offset-${{ matrix.offset }} (2x1024 sequential)"
            echo "- job_started_at: $START"
            echo "- job_finished_at: $END"
          } >> "$GITHUB_STEP_SUMMARY"

  group3_512_sequential:
    needs: group2_1024_sequential
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: group3 4x512 sequential offset-${{ matrix.offset }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - offset: 0
            row_count: 512
          - offset: 512
            row_count: 512
          - offset: 1024
            row_count: 512
          - offset: 1536
            row_count: 512
    outputs:
      job_started_at: ${{ steps.record_timestamps.outputs.job_started_at }}
      job_finished_at: ${{ steps.record_timestamps.outputs.job_finished_at }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@22695119d769bdb6f7032ad67b9bca0ef8c4a174
      - run: uv sync --dev --extra distilbert
      - name: Run synthetic public benchmark case
        env:
          PBE_BENCH_CASE_ID: 4x512_sequential
          PBE_BENCH_MODE: sequential
          PBE_BENCH_OFFSET: ${{ matrix.offset }}
          PBE_BENCH_ROW_COUNT: ${{ matrix.row_count }}
        run: |
          set -euo pipefail
          uv run python tests/performance/distilbert_fullsize_public_benchmark.py | tee benchmark-case.json
      - name: Record group timestamps from benchmark JSON
        id: record_timestamps
        run: |
          START=$(python -c "import json; print(json.load(open('benchmark-case.json'))['timestamps']['job_started_at'])")
          END=$(python -c "import json; print(json.load(open('benchmark-case.json'))['timestamps']['job_finished_at'])")
          echo "job_started_at=$START" >> "$GITHUB_OUTPUT"
          echo "job_finished_at=$END" >> "$GITHUB_OUTPUT"
          {
            echo "### Group 3 shard offset-${{ matrix.offset }} (4x512 sequential)"
            echo "- job_started_at: $START"
            echo "- job_finished_at: $END"
          } >> "$GITHUB_STEP_SUMMARY"

  group4_2048_model_parallel:
    needs: group3_512_sequential
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: group4 1x2048 model parallel
    outputs:
      job_started_at: ${{ steps.record_timestamps.outputs.job_started_at }}
      job_finished_at: ${{ steps.record_timestamps.outputs.job_finished_at }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@22695119d769bdb6f7032ad67b9bca0ef8c4a174
      - run: uv sync --dev --extra distilbert
      - name: Run synthetic public benchmark case
        env:
          PBE_BENCH_CASE_ID: 1x2048_model_parallel
          PBE_BENCH_MODE: model_parallel
          PBE_BENCH_OFFSET: "0"
          PBE_BENCH_ROW_COUNT: "2048"
        run: |
          set -euo pipefail
          uv run python tests/performance/distilbert_fullsize_public_benchmark.py | tee benchmark-case.json
      - name: Record group timestamps from benchmark JSON
        id: record_timestamps
        run: |
          START=$(python -c "import json; print(json.load(open('benchmark-case.json'))['timestamps']['job_started_at'])")
          END=$(python -c "import json; print(json.load(open('benchmark-case.json'))['timestamps']['job_finished_at'])")
          echo "job_started_at=$START" >> "$GITHUB_OUTPUT"
          echo "job_finished_at=$END" >> "$GITHUB_OUTPUT"
          {
            echo "### Group 4 (1x2048 model parallel)"
            echo "- job_started_at: $START"
            echo "- job_finished_at: $END"
          } >> "$GITHUB_STEP_SUMMARY"

  benchmark_group_timeline:
    needs:
      - group1_2048_sequential
      - group2_1024_sequential
      - group3_512_sequential
      - group4_2048_model_parallel
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: benchmark group timeline summary
    steps:
      - name: Summarize four group job windows
        env:
          G1_START: ${{ needs.group1_2048_sequential.outputs.job_started_at }}
          G1_END: ${{ needs.group1_2048_sequential.outputs.job_finished_at }}
          G4_START: ${{ needs.group4_2048_model_parallel.outputs.job_started_at }}
          G4_END: ${{ needs.group4_2048_model_parallel.outputs.job_finished_at }}
        run: |
          {
            echo "## DistilBERT 2048 public benchmark group timeline"
            echo "| Group | job_started_at | job_finished_at |"
            echo "| --- | --- | --- |"
            echo "| 1 — 1x2048 sequential | $G1_START | $G1_END |"
            echo "| 2 — 2x1024 sequential (concurrent shards; see matrix legs) | (per shard) | (per shard) |"
            echo "| 3 — 4x512 sequential (concurrent shards; see matrix legs) | (per shard) | (per shard) |"
            echo "| 4 — 1x2048 model parallel | $G4_START | $G4_END |"
          } >> "$GITHUB_STEP_SUMMARY"

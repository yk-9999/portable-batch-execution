name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
      - run: uv sync --dev --extra distilbert
      - run: uv lock --check
      - name: Verify HF OIDC CLI command is installed
        run: uv run --extra distilbert hf auth token --help > /dev/null
      - run: uv run --extra distilbert ruff check .
      - run: uv run --extra distilbert pytest
